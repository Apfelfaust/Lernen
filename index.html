<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lernen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Lernen</title>
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#1F2328;--sub:#5B6470;--line:#E6E9EE;--blue:#336DE6;--blue-d:#1D49AA;--blue-l:#DCE7FC;--blue-xl:#EDF3FD;--red:#C8553D;--red-d:#9A2E22;--red-l:#FCEBEA;--red-b:#F0C4BE;--safe:env(safe-area-inset-top)}
*{box-sizing:border-box}
html,body{overflow-x:clip;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
#safe{position:fixed;top:0;left:0;right:0;height:var(--safe);background:var(--bg);z-index:20}
#app{max-width:760px;margin:0 auto;padding:calc(var(--safe) + 6px) 14px 110px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:26px}
h2{margin:6px 0 0;font-size:16px}
.muted{color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:16px;padding:12px 14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pill{font-size:12px;font-weight:600;color:var(--blue-d);background:var(--blue-l);padding:6px 10px;border-radius:999px;white-space:nowrap}
button,.btn{font:inherit;cursor:pointer;border-radius:14px;min-height:48px;padding:11px 14px;font-weight:600;font-size:15px;background:var(--card);color:var(--ink);border:1px solid #D5DAE1}
.tourph{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:inset 0 0 0 1.5px #E1E5EB;display:flex;gap:12px;align-items:center}.tourph b{font-size:15px;color:var(--sub)}.tico{width:44px;height:44px;border-radius:12px;background:#EEF0F3;display:flex;align-items:center;justify-content:center;flex:none}.soon{font-size:11px;font-weight:700;color:var(--sub);background:var(--line);padding:4px 8px;border-radius:999px}
.btn-p{background:var(--blue);color:#fff;border:none}
.btn-w{background:#fff;color:var(--blue-d);border:none}
.hero{background:var(--blue);color:#fff;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.hero .big{font-size:34px;font-weight:700}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}.bar>div{height:6px;background:var(--blue)}
.bar .mid{background:#A9C4F5}
.list>.item{padding:11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;cursor:pointer}
.list>.item:last-child{border-bottom:none}
.sugg{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;border:none;text-align:left;width:100%;min-height:60px;font-weight:400}
.ico{width:36px;height:36px;border-radius:10px;background:var(--blue-l);display:flex;align-items:center;justify-content:center;flex:none}
.ico.red{background:var(--red-l)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E1E5EA;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{border:none;background:none;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub);font-weight:500;padding:4px 18px}
nav button.on{color:var(--blue);font-weight:600}
.head{position:sticky;top:var(--safe);z-index:10;background:var(--bg);margin:-6px -14px 0;padding:2px 14px 0;display:flex;flex-direction:column;gap:6px}
.head .back{width:34px;height:34px;min-height:34px;background:none;margin-left:-8px}
.head .bar,.head .bar>div{height:3px}
.htitle{background:#fff;border-radius:16px 16px 0 0;border-bottom:1px solid var(--line);padding:12px 14px 9px;margin-top:2px}
.head:has(.htitle)+.card,.head:has(.htitle)+details.card{border-top-left-radius:0;border-top-right-radius:0;margin-top:-12px}
.stages .wide{flex:2.2}
.ring{position:relative;width:44px;height:44px;flex:none}.ring svg{position:absolute;inset:0}.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;line-height:1;color:var(--ink)}.ring b small{font-size:8.5px;color:var(--sub);font-weight:500;margin-top:1px}
.stages .stg,.stages span{height:28px;min-height:28px}
.back{width:44px;height:44px;min-height:44px;padding:0;display:flex;align-items:center;justify-content:center;border:none;flex:none}
.stages{display:flex;gap:6px;align-items:center}
.stages span{flex:1;height:30px;border-radius:8px;background:#fff;color:var(--sub);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stages .stg{flex:1;height:30px;min-height:30px;padding:0;border:none;border-radius:8px;font-size:12px;font-weight:700}
.stages .stg.done{background:var(--blue-l);color:var(--blue-d)}.stages .stg.cur{background:var(--blue);color:#fff}
.stages .done{background:var(--blue-l);color:var(--blue-d)}.stages .cur{background:var(--blue);color:#fff}.stages .na{opacity:.35}
.stagename{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.formel{background:var(--blue-xl);border:1px solid #BCD0EE;border-radius:8px;padding:8px 10px;font-weight:700;color:var(--blue-d);white-space:pre-line;font-size:14px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px 8px 0;border-top:1px solid var(--line);vertical-align:top;text-align:left;line-height:1.4;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
th{color:var(--blue);font-size:13px;border-top:none}
td:first-child{font-weight:600;width:34%}
@media (max-width:560px){
 table,tbody,tr,td{display:block;width:100%}
 tr:first-child th{display:none}
 tr{border-top:1px solid var(--line);padding:8px 0}
 td{border:none;padding:0}
 td:first-child{width:auto;color:var(--blue-d);font-size:13.5px;margin-bottom:2px}
}
.fall-link{color:var(--blue);font-weight:600;cursor:pointer;display:inline-flex;gap:4px;align-items:center;margin-top:4px;min-height:32px;border:none;background:none;padding:0;font-size:14px}
.txt{font-size:15px;line-height:1.5;margin:0;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 12px;border-radius:999px;font-size:14px;border:1px solid #D5DAE1;background:#fff}
.chip.sel{border:2px solid var(--blue-d);background:var(--blue-xl)}
.chip.ok{opacity:.35}
.ans{display:flex;flex-direction:column;gap:8px}
.ansb{text-align:left;font-weight:500;font-size:14.5px;line-height:1.35;padding:10px 12px;min-height:48px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.ansb.ok{border:2px solid var(--blue);background:var(--blue-xl);color:var(--blue-d)}
.ansb.bad{border:2px solid var(--red);background:var(--red-l)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.navb{position:relative}.nbadge{position:absolute;top:0;right:10px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:20px;text-align:center}
.zbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--blue);color:#fff;padding:18px 16px calc(30px + env(safe-area-inset-bottom));min-height:210px;border-radius:18px 18px 0 0;box-shadow:0 -4px 16px rgba(29,73,170,.18);touch-action:pan-y}
.zin{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.zrow{display:flex;align-items:center;justify-content:center;gap:12px}
@media (pointer:coarse){.zarr{display:none}}
.zarr{min-height:40px;width:44px;padding:0;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:22px;border-radius:12px;flex:none}
.zterm{width:100%;background:#fff;color:var(--blue-d);border-radius:14px;padding:14px 16px;font-weight:700;font-size:17px;line-height:1.3;text-align:center;min-height:76px;display:flex;align-items:center;justify-content:center;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.zdots{display:flex;gap:6px;justify-content:center}.zdots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.35);display:block}.zdots i.c{background:#fff}.zdots i.d{background:rgba(255,255,255,.75)}.zdots i.c{width:20px}
.tag{display:inline-block;font-size:11px;font-weight:700;background:var(--blue);color:#fff;border-radius:6px;padding:2px 6px;margin-bottom:4px}
.gap{display:inline-block;min-width:80px;max-width:100%;height:34px;border:none;border-bottom:2px solid var(--blue);background:var(--blue-xl);border-radius:6px 6px 0 0;padding:0 8px;font-weight:600;font-size:15px;font-family:inherit;color:var(--blue-d);margin:2px 0}
.gap.bad{background:var(--red-l);border-color:var(--red);color:var(--red-d)}
.cloze{font-size:16px;line-height:2.2}
.fb{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.fb.ok{background:var(--blue-xl);color:var(--blue-d);border:1px solid #BCD0EE}
.fb.bad{background:var(--red-l);color:#5A1C15;border:1px solid var(--red-b)}
textarea{width:100%;min-height:110px;border:1px solid #D5DAE1;border-radius:12px;padding:10px;font-size:15px;line-height:1.45;font-family:inherit;color:var(--ink);resize:vertical}
.numin{width:100%;height:50px;border:1px solid #D5DAE1;border-radius:12px;padding:0 12px;font-size:18px;font-family:inherit}
.kp{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;padding:6px 0}
.kp input{width:22px;height:22px;margin:0;accent-color:var(--blue);flex:none}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rate button{min-height:56px;padding:6px 2px;font-size:14px;line-height:1.2}
.rate small{display:block;font-weight:400;font-size:11px;margin-top:2px}
.rate .again{background:var(--red-l);color:var(--red-d);border-color:var(--red-b)}
.rate .sug{background:var(--blue);color:#fff;border-color:var(--blue)}
.badge{font-size:11px;font-weight:600;padding:3px 7px;border-radius:999px;background:var(--blue-l);color:var(--blue-d);white-space:nowrap}
.badge.grey{background:#E8EBEF;color:var(--sub)}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots i{width:10px;height:10px;border-radius:5px;background:#D5DAE1;display:block}
.dots i.w{background:#A9C4F5}.dots i.s{background:var(--blue)}
.lab{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.step{display:flex;gap:10px;font-size:15px;line-height:1.5;padding:4px 0}.n{flex:none;width:22px;height:22px;border-radius:11px;background:var(--blue-l);color:var(--blue-d);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.steps{margin:0;padding-left:20px;font-size:14px;line-height:1.5}
details summary{cursor:pointer;font-weight:600;color:var(--blue);font-size:14px;min-height:32px;display:flex;align-items:center}
.slot{border:2px dashed #BCD0EE;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:#fff;text-align:left;font-weight:400;min-height:56px}
.slot.bad{border-color:var(--red);background:var(--red-l)}
.slot b{font-size:14px}
.placed{font-size:13px;background:var(--blue-xl);color:var(--blue-d);border-radius:8px;padding:6px 8px;line-height:1.35}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;width:max-content;max-width:88vw;text-align:center}

/* Übergänge */
.stages .wide{flex:2.4;white-space:nowrap;padding:0 6px}
nav{view-transition-name:nav}.head{view-transition-name:head}#zbar{view-transition-name:zbar}
::view-transition-old(root),::view-transition-new(root){animation-duration:.24s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-group(head),::view-transition-old(head),::view-transition-new(head){animation-duration:.2s}
@keyframes vtInR{from{opacity:0;transform:translateX(28px)}}@keyframes vtOutL{to{opacity:0;transform:translateX(-18px)}}
@keyframes vtInL{from{opacity:0;transform:translateX(-28px)}}@keyframes vtOutR{to{opacity:0;transform:translateX(18px)}}
[data-vt=fwd]::view-transition-new(root){animation-name:vtInR}[data-vt=fwd]::view-transition-old(root){animation-name:vtOutL}
[data-vt=back]::view-transition-new(root){animation-name:vtInL}[data-vt=back]::view-transition-old(root){animation-name:vtOutR}
button,.item,.sugg,.chip,.ansb,.slot{transition:transform .12s ease,background-color .18s ease,color .18s ease,box-shadow .18s ease}
button:active,.item:active,.sugg:active,.chip:active,.ansb:active,.slot:active{transform:scale(.97)}
.fb{animation:pop .22s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.toast{animation:tpop .22s ease}@keyframes tpop{from{opacity:0;transform:translate(-50%,6px)}}

/* Folien-Tour */
.tourc{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#EDF3FD,#fff 65%);border:none;box-shadow:inset 0 0 0 1.5px #C9DAF8;border-radius:16px;padding:12px 14px;min-height:0}
.tourc b{font-size:15px}.tico.on{background:var(--blue-l)}
.tourph.sm{padding:9px 14px}.tourph.sm .tico{width:36px;height:36px}.tourph.sm .tico svg{width:22px;height:22px}
body.tourw #app{max-width:1180px;padding-bottom:120px}
.tgrid{display:block}.tagenda{display:none}
.tmain{display:flex;flex-direction:column;gap:12px}
.ttitle{font-size:17px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tslide.uz{touch-action:none}.tslide.uz .tmini{display:none!important}
.tslide{position:relative;overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tzl{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.tzl img{display:block;width:100%;height:auto}
.tzl.tin img{animation:tfade .35s ease}
@keyframes tfade{from{opacity:.25}to{opacity:1}}
.tspot{position:absolute;pointer-events:none;transition:left .55s cubic-bezier(.3,.7,.2,1),top .55s cubic-bezier(.3,.7,.2,1),width .55s cubic-bezier(.3,.7,.2,1),height .55s cubic-bezier(.3,.7,.2,1)}
.tarr{position:absolute;pointer-events:none;z-index:2}
.tarr.bob{animation:tbob 1.4s ease-in-out .5s 2}
.tarr.bob:not(.up){animation-name:tbobd}
@keyframes tbob{0%,100%{translate:0 0}50%{translate:0 6px}}
@keyframes tbobd{0%,100%{translate:0 0}50%{translate:0 -6px}}
.tmini{position:absolute;right:8px;bottom:8px;width:86px;border-radius:5px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.35);border:1.5px solid #fff;z-index:3}
.tmini img{display:block;width:100%;filter:brightness(.78)}
.tmini b{position:absolute;border:1.5px solid #FFD84D;border-radius:2px}
.tcard{display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.tql{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.tpill{}@media (max-width:480px){.tpill{display:none}.tarr{width:34px;height:42px}}
.tq{font-size:17px;font-weight:700;line-height:1.3}
.tstrip{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:9px 30px calc(12px + env(safe-area-inset-bottom));z-index:20}
.tsl{font-size:12px;font-weight:700;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-right:8px}
.tsegs{display:flex;gap:4px;align-items:center;height:36px;margin:0;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}.tsegs.drag .tseg i{transform:scale(1.25)}
.tseg{height:6px;min-height:0;padding:0;border:none;pointer-events:none;border-radius:3px;background:#D5DAE1;position:relative;overflow:visible}
.tseg.d{background:var(--blue)}.tseg b{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.tseg i{position:absolute;top:-5px;width:16px;height:16px;border-radius:8px;background:#fff;box-shadow:0 0 0 3px var(--blue),0 1px 4px rgba(0,0,0,.2)}
.tsegl{display:flex;gap:4px;font-size:10.5px;font-weight:700;color:var(--sub)}.tsegl span{text-align:center}.tsegl .on{color:var(--blue)}
@media (min-width:900px){
 .tgrid{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
 .tagenda{display:block;position:sticky;top:calc(var(--safe) + 10px);background:#fff;border-radius:16px;padding:14px 14px 6px;max-height:calc(100vh - 30px);overflow:auto}
 .tstrip{display:none}body.tourw #app{padding-bottom:40px}
}
.tat{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.tch{display:flex;gap:10px;position:relative;padding-bottom:12px}
.tln{position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}.tch.done .tln{background:var(--blue)}
.tnb{width:22px;height:22px;min-height:0;padding:0;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--line);color:var(--sub);border:none;z-index:1}
.tch.done .tnb{background:var(--blue);color:#fff}.tch.cur .tnb{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.ttt{all:unset;cursor:pointer;font-size:13px;font-weight:600;line-height:1.3;display:block}.tch:not(.cur):not(.done) .ttt{color:var(--sub)}
.tss{font-size:11.5px;color:var(--sub);margin-top:2px}
.tstops{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.tstop{all:unset;cursor:pointer;display:flex;align-items:flex-start;gap:7px;font-size:12px;line-height:1.3;color:var(--sub);padding:2px 0}
.tstop i{width:8px;height:8px;border-radius:4px;background:#D5DAE1;flex:none;margin-top:3px}
.tstop.d i{background:var(--blue)}.tstop.c{color:var(--ink);font-weight:700}.tstop.c i{width:10px;height:10px;border-radius:5px;background:#fff;box-shadow:0 0 0 2.5px var(--blue);margin-top:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Variante C: große Flächen hell, kräftiges Blau nur für Akzente */
.stages .cur,.stages .stg.cur{background:var(--blue-l);color:var(--blue-d);box-shadow:inset 0 0 0 1.5px #A9C4F5}
.stages .done,.stages .stg.done{background:#E9EDF3;color:var(--sub)}
.zbar{background:#E4ECFB;color:var(--blue-d);box-shadow:0 -4px 16px rgba(29,73,170,.12)}
.zarr{background:rgba(29,73,170,.08);color:var(--blue-d)}
.zdots i{background:#BFD0F2}.zdots i.c{background:var(--blue)}.zdots i.d{background:#8EADEB}
.hero{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--blue-l)}
.hero .btn-w{background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.burgers{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}

.hcard{background:linear-gradient(135deg,var(--blue-xl),#fff 60%);border-radius:18px;padding:14px;box-shadow:inset 0 0 0 1.5px var(--blue-l);display:flex;gap:12px;align-items:center}
.hburger{transform:rotate(-12deg);flex:none;line-height:0}
.ht1{font-size:19px;font-weight:800;line-height:1.15}.ht2{font-size:13px;color:var(--sub);margin-top:4px}
.hcheck{flex:none;width:76px;height:76px;border-radius:38px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue-l)}
.bite{width:100%;margin-top:10px;font-size:16px;font-weight:700}
.btn-s{width:100%;margin-top:10px;background:#fff;color:var(--blue-d);border:none;box-shadow:inset 0 0 0 1.5px var(--blue-l);font-weight:600}
.plate{display:block;width:100%;max-width:420px;margin:6px auto 0}
.plcap{font-size:12.5px;color:var(--sub);text-align:center;margin-top:2px}

#rdpop .rparrow{position:absolute;top:-8px;width:16px;height:16px;background:#fff;transform:rotate(45deg);box-shadow:-1px -1px 0 var(--line)}
#rdpop .rphead{display:flex;gap:12px;align-items:center;margin-bottom:12px;color:var(--blue)}#rdpop .rphead b{color:var(--ink);font-size:16px}
#rdpop .rpseg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
#rdpop .rpseg button{flex:1;min-height:34px;padding:0;border:none;background:none;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub)}

#rdpop .rprow{display:flex;align-items:center;gap:10px;color:var(--sub)}#rdpop .rprow span{line-height:0}#rdpop input[type=range]{flex:1;accent-color:var(--blue)}

.acht .fr2{display:flex;gap:8px;margin-top:8px}.acht .fr2 div{flex:1;background:#fff;border-radius:8px;padding:7px 9px;font-size:13.5px}.acht .fr2 b{display:block;font-size:12px}
.acht .ah{font-size:12px;margin-top:6px;opacity:.8}

<body>
<div id="safe"></div>
<script>/* iOS: liegt die App schon unter der Statusleiste, keinen zweiten Abstand einbauen */(function(){function f(){var d=screen.height-innerHeight;document.documentElement.style.setProperty("--safe",(d>20||innerWidth>innerHeight)?"0px":"env(safe-area-inset-top)")}f();addEventListener("resize",f)})()</script>
<input type="file" id="file" accept="application/json,.json" style="display:none">
<div id="app"><p class="muted">Lade Inhalte …</p></div>
<nav id="nav">
<button data-act="tab" data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Heute</button>
<button data-act="tab" data-tab="faecher"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg>Fächer</button>
<button class="navb" data-act="tab" data-tab="daten"><span class="nbadge" id="badge" hidden></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Lernstand</button>
</nav>
<script>
"use strict";
/* ============ Grundlagen ============ */
const KEY="lernapp.v1";
const STAGES=["Ansehen","Zuordnen","Lückentext","Erklären"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const fmtDate=s=>{const d=new Date(s+"T12:00:00");return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
const IC={
 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
 lines:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#336DE6" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"/></svg>',
 plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8553D" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
 calc:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#336DE6" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>',
 slides:'<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="2" y="4" width="22" height="16" rx="2.5" fill="#fff" stroke="#336DE6" stroke-width="2"/><rect x="5" y="7" width="16" height="10" rx="1" fill="#336DE6" opacity=".35"/><rect x="7" y="10" width="9" height="4" rx="1" fill="#fff" stroke="#336DE6" stroke-width="1.5"/><path d="M13 20v3M9 23h8" stroke="#336DE6" stroke-width="2" stroke-linecap="round"/></svg>',
 chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#336DE6" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
 map:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#336DE6" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="5" r="2"/><circle cx="20" cy="5" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/><path d="M6 6l4 4M18 6l-4 4M6 18l4-4M18 18l-4-4"/></svg>'
};

let store=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.p){s.seen=s.seen||{};return s}}catch(e){}return{p:{},seen:{},device:"",lastExport:null,rechnenTag:null,dirty:0}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){toast("Speichern nicht möglich")}}

/* ============ Inhalte ============ */
let F=[];
async function loadContent(){
  const idx=await (await fetch("content/index.json",{cache:"no-cache"})).json();
  F=idx.faecher.map(f=>({...f,data:null}));
  await Promise.all(F.map(async f=>{
    if(!f.datei)return;
    try{f.data=await (await fetch("content/"+f.datei,{cache:"no-cache"})).json();normalize(f)}catch(e){f.fehler=true}
  }));
}
// Format 1 (ein Thema = eine Karte) in Format 2 umwandeln
function normalize(f){
  (f.data.themen||[]).forEach(t=>{
    if(!t.karten){t.karten=[{id:"k",titel:t.titel,frage:t.erklaeren?.frage||"",kernpunkte:t.erklaeren?.kernpunkte||[],zuordnen:t.zuordnen,luecken:t.luecken}]}
    t.karten.forEach(k=>{k._t=t});
    if(store.p[f.id+":"+t.id])store.seen[f.id+":"+t.id]=1; // alter Lernstand v1
  });
}
const fach=id=>F.find(f=>f.id===id);
const fol=s=>/^\d/.test(String(s||""))?"Folie "+s:String(s||"");
const themen=f=>f?.data?.themen||[];
const aufgaben=f=>f?.data?.aufgaben||[];
const thema=(fid,tid)=>themen(fach(fid)).find(t=>t.id===tid);
const karte=(fid,tid,cid)=>thema(fid,tid)?.karten.find(k=>k.id===cid);
const cKey=(fid,tid,cid)=>fid+":"+tid+":"+cid;
const aKey=(fid,aid)=>fid+":a:"+aid;
function avail(k){if(k.typ==="fall")return[4];const s=[1];if(k.zuordnen&&k.zuordnen.length)s.push(2);if(k.luecken&&k.luecken.length)s.push(3);s.push(4);return s}
function stageOf(fid,t,k){
  const p=store.p[cKey(fid,t.id,k.id)], av=avail(k);
  if(p&&av.includes(p.stage))return p.stage;
  if(p){return av.find(s=>s>=p.stage)||av[av.length-1]}
  if(store.seen[fid+":"+t.id]&&av.length>1)return av[1];
  return av[0];
}
function P(k){return store.p[k]||{stage:null,streak:0,ivl:0,due:null,reps:0,lapses:0,last:null}}
const isDue=k=>{const p=store.p[k];return !p||!p.due||p.due<=today()};
function status(fid,t,k){const p=store.p[cKey(fid,t.id,k.id)];if(!p||!p.reps)return store.seen[fid+":"+t.id]?"w":"n";const av=avail(k);return (stageOf(fid,t,k)===av[av.length-1]&&p.ivl>=3)?"s":"w"}
function capDue(fid,date){
  const ex=fach(fid)?.klausur; if(!ex)return date;
  const lim=addDays(ex,-1);
  if(date>lim)return lim>today()?lim:addDays(today(),1);
  return date;
}
function rateCard(fid,t,k,r){
  const key=cKey(fid,t.id,k.id); const p={...P(key)}; const av=avail(k);
  let st=stageOf(fid,t,k); p.reps++; p.last=new Date().toISOString(); let requeue=false;
  const i=av.indexOf(st);
  if(r==="again"){p.lapses++;p.streak=0;p.ivl=0;if(i>0&&av[i-1]>1)st=av[i-1];p.due=today();requeue=true}
  else if(r==="hard"){p.streak=0;p.ivl=1}
  else{
    p.streak+= r==="easy"?2:1;
    if(i<av.length-1){p.ivl=1;if(p.streak>=2){st=av[i+1];p.streak=0}}
    else p.ivl= r==="easy"?Math.max(4,Math.round(p.ivl*3)):Math.max(2,Math.round(p.ivl*2));
  }
  p.stage=st; if(r!=="again")p.due=capDue(fid,addDays(today(),p.ivl));
  store.p[key]=p; markDirty(); return requeue;
}
function rateAufgabe(fid,aid,r){
  const key=aKey(fid,aid); const p={...P(key)}; p.reps++; p.last=new Date().toISOString(); let requeue=false;
  if(r==="again"){p.lapses++;p.ivl=0;p.due=today();requeue=true}
  else if(r==="hard")p.ivl=1;
  else p.ivl=r==="easy"?Math.max(4,Math.round(p.ivl*3)):Math.max(2,Math.round(p.ivl*2));
  if(r!=="again")p.due=capDue(fid,addDays(today(),p.ivl));
  store.p[key]=p; store.rechnenTag=today(); markDirty(); return requeue;
}
function markSeen(fid,tid){store.seen[fid+":"+tid]=1;markDirty()}

/* ============ Kennzahlen ============ */
function allCards(f){const out=[];themen(f).forEach(t=>t.karten.forEach(k=>out.push({fid:f.id,t,k})));return out}
function dueCards(fid){const out=[];F.filter(f=>!fid||f.id===fid).forEach(f=>allCards(f).forEach(c=>{if(isDue(cKey(f.id,c.t.id,c.k.id)))out.push({kind:"k",fid:f.id,tid:c.t.id,cid:c.k.id})}));return out}
function dueAufgaben(fid){const out=[];F.filter(f=>!fid||f.id===fid).forEach(f=>aufgaben(f).forEach(a=>{if(isDue(aKey(f.id,a.id)))out.push({kind:"a",fid:f.id,id:a.id})}));return out}
function counts(f){const c={n:0,w:0,s:0};allCards(f).forEach(x=>c[status(f.id,x.t,x.k)]++);return c}
function progressBar(c){const tot=c.n+c.w+c.s||1;return `<div class="bar"><div style="width:${100*c.s/tot}%"></div><div class="mid" style="width:${100*c.w/tot}%"></div></div>`}

/* ============ Ansichten ============ */
let view={tab:"home"}; let S=null;
const app=$("#app");
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===view.tab));
  document.body.classList.toggle("tourw",!!(view.tour&&!S));
  const full=S||view.fall||view.puzzle||view.tour;
  $("#nav").style.display=full?"none":"flex";
  const bd=$("#badge"); if(bd){const n=(!FS&&store.dirty>0)?store.dirty:0; bd.hidden=!n; bd.textContent=n>99?"99+":n;}
  if(view.reward&&!S){$("#nav").style.display="none";return renderReward()}
  if(view.fall)return renderFall();
  if(S){renderSession();rdApply();return}
  if(view.puzzle)return renderPuzzle();
  if(view.tour)return renderTour();
  if(view.tab==="home"){renderHome();placeBubble();return}
  if(view.tab==="faecher"){if(view.thema)return renderThema();if(view.fach)return renderFach();return renderFaecher()}
  if(view.tab==="daten")return renderDaten();
}
function headBar(sub,title,act="up"){return `<div class="row"><button class="back" data-act="${act}" aria-label="Zurück">${IC.back}</button><div style="flex:1;min-width:0"><div class="muted" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sub)}</div><div style="font-size:18px;font-weight:700;line-height:1.25">${esc(title)}</div></div></div>`}
function renderHome(){
  const t=today(); const wd=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const next=F.map(f=>f.klausur).filter(k=>k&&k>=t).sort()[0];
  const due=dueCards(), dueA=dueAufgaben();
  const perF={}; due.forEach(d=>perF[d.fid]=(perF[d.fid]||0)+1);
  let h=`<div class="row between" style="align-items:flex-end"><div><div class="muted">${esc(wd)}</div><h1>Heute</h1></div>${next?`<span class="pill">${daysBetween(t,next)} Tage bis ${fmtDate(next)}</span>`:""}</div>`;
  h+=syncBanner()+bubbleHTML();
  h+=heroHTML(due.length);
  h+=`<h2>Fächer</h2><div class="card list" style="padding:2px 14px">`;
  F.forEach(f=>{
    const c=counts(f), n=perF[f.id]||0, tot=c.n+c.w+c.s;
    const note=!f.datei?`<span style="color:var(--red);font-weight:600">Inhalte fehlen</span>`:f.fehler?`<span style="color:var(--red);font-weight:600">Datei fehlerhaft</span>`:`<span style="color:var(--blue);font-weight:600">${n} fällig</span>`;
    h+=`<div class="item" data-act="openfach" data-fid="${esc(f.id)}"><div class="row between" style="font-size:14px"><b>${esc(f.name)}</b><span class="muted" style="font-size:12px">${f.klausur?fmtDate(f.klausur):""}</span></div>
    ${progressBar(c)}<div class="row between" style="font-size:12px;color:var(--sub)"><span>${tot?`${c.s} sitzen · ${c.w} in Arbeit · ${c.n} neu`:"noch keine Karten"}</span>${note}</div></div>`;
  });
  h+=`</div><h2>Vorschläge</h2><div style="display:flex;flex-direction:column;gap:8px">`;
  const sug=[];
  if(dueA.length&&store.rechnenTag!==t)sug.push(`<button class="sugg" data-act="start" data-what="rechnen"><span class="ico">${IC.calc}</span><span style="flex:1;font-size:13px;line-height:1.35"><b>Tägliches Rechentraining</b><br><span class="muted">${dueA.length} Rechenaufgaben fällig</span></span></button>`);
  const weak=[];F.forEach(f=>allCards(f).forEach(c=>{const p=store.p[cKey(f.id,c.t.id,c.k.id)];if(p&&p.lapses>0)weak.push({f,c,p})}));
  weak.sort((a,b)=>b.p.lapses-a.p.lapses).slice(0,2).forEach(w=>sug.push(`<button class="sugg" data-act="start" data-what="thema" data-fid="${esc(w.f.id)}" data-tid="${esc(w.c.t.id)}"><span class="ico">${IC.lines}</span><span style="flex:1;font-size:13px;line-height:1.35"><b>${esc(w.c.t.titel)}</b><br><span class="muted">${w.p.lapses}× nicht gewusst – nochmal festigen</span></span></button>`));
  const pf=F.find(f=>f.data&&counts(f).w+counts(f).s>=5);
  if(pf)sug.push(`<button class="sugg" data-act="puzzle" data-fid="${esc(pf.id)}"><span class="ico">${IC.map}</span><span style="flex:1;font-size:13px;line-height:1.35"><b>Mindmap-Puzzle ${esc(pf.name.split(" · ")[0])}</b><br><span class="muted">Ordne die Bausteine den Themen zu – trainiert die Übersicht</span></span></button>`);

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

const TOURS={};
async function openTour(fid){

  if(!TOURS[fid]){try{const T=await (await fetch("content/"+f.tour,{cache:"no-cache"})).json();T.flat=T.kapitel.flatMap((k,ki)=>k.stops.map(st=>({...st,ki})));TOURS[fid]=T}catch(e){toast("Folien-Tour konnte nicht geladen werden");return}}

}
function tourGo(i){const v=view.tour,T=TOURS[v.fid];const old=T.flat[v.i];v.prev={img:old.img,spot:old.spot};v.i=Math.max(0,Math.min(T.flat.length-1,i));lsSet("tour:"+v.fid,v.i);render();if(!tourWide())window.scrollTo(0,0)}

function rdWords(){return [...document.querySelectorAll(".rdw")]}
function rdApply(){
  document.body.classList.toggle("rdm1",rdMode===1);document.body.classList.toggle("rdm2",rdMode===2);
  if(!rdMode||!S||!S.ui)return;
  const card=document.querySelector(".head + .card"); if(!card||card.querySelector("input,textarea"))return;

  <div class="row between" style="margin:14px 0 2px"><b style="font-size:14px">Tempo</b><span class="rpval">${tempoTxt(rdTempo)}</span></div>
  <div class="rprow"><span aria-hidden="true" title="langsamer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 15c0-4 3.5-7 8-7s8 3 8 7z"/><path d="M6 15l-1 3M18 15l1 3M20 13h2"/></svg></span><input type="range" min="0.5" max="3" step="0.25" value="${rdTempo}" id="rdrange" aria-label="Tempo"><span aria-hidden="true" title="schneller"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3c1 3 1 6 1 8M13 3c0 3-1 6-2 8"/><ellipse cx="12" cy="16" rx="6" ry="5"/></svg></span></div>
  <div class="muted" style="font-size:12px;margin-top:4px">Wie viele Wörter pro Daumenbewegung weitergehen.</div>`;
  d.style.top=(r.bottom+10)+"px";document.body.appendChild(d);
  d.querySelector("#rdrange").addEventListener("input",e=>{rdTempo=+e.target.value;try{localStorage.setItem("rdt",rdTempo)}catch(_){}d.querySelector(".rpval").textContent=tempoTxt(rdTempo)});
  d.querySelectorAll("[data-rdset]").forEach(x=>x.addEventListener("click",ev=>{ev.stopPropagation();rdMode=+x.dataset.rdset;try{localStorage.setItem("rd",rdMode)}catch(_){}d.querySelectorAll("[data-rdset]").forEach(y=>y.classList.toggle("on",+y.dataset.rdset===rdMode));render()}));
}
function rdPopClose(){const d=$("#rdpop");if(d)d.remove()}
let lpT=null,lpFired=false;
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".rdbtn");if(!b)return;lpFired=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=true;rdPopOpen();if(navigator.vibrate)navigator.vibrate(10)},450)});
["pointerup","pointercancel","pointerleave"].forEach(t=>document.addEventListener(t,()=>clearTimeout(lpT)));

document.addEventListener("click",e=>{const d=$("#rdpop");if(d&&!e.target.closest("#rdpop")&&!e.target.closest(".rdbtn")){rdPopClose()}},true);

let ry=null,racc=0;
document.addEventListener("touchstart",e=>{ry=rdActive()&&!e.target.closest("button,#zbar,input,textarea,.rate,#rdpop")?e.touches[0].clientY:null;racc=0},{passive:true});
document.addEventListener("touchmove",e=>{if(ry===null)return;const y=e.touches[0].clientY;racc+=ry-y;ry=y;
  const atEnd=S.ui.rdi>=rdWords().length-1&&racc>0, atStart=S.ui.rdi<=0&&racc<0;
  if(atEnd||atStart){return}           // am Ende normal weiterscrollen
  e.preventDefault();

let wacc=0;
document.addEventListener("wheel",e=>{if(!rdActive()||e.target.closest("#rdpop"))return;const atEnd=S.ui.rdi>=rdWords().length-1&&e.deltaY>0, atStart=S.ui.rdi<=0&&e.deltaY<0;if(atEnd||atStart)return;
  e.preventDefault();wacc+=e.deltaY;const st=40/rdTempo;while(Math.abs(wacc)>=st){const d=wacc>0?1:-1;wacc-=d*st;if(!rdStep(d))break}},{passive:false});
document.addEventListener("keydown",e=>{if(!rdActive()||e.target.matches("input,textarea")||(S.ui&&S.ui.order))return;
  if(e.key==="ArrowDown"||e.key===" "){e.preventDefault();rdStep(1)}if(e.key==="ArrowUp"){e.preventDefault();rdStep(-1)}});

/* ============ Ereignisse ============ */
const NAV={more:"fwd",full:"fade",tab:"fade",openfach:"fwd",openthema:"fwd",up:"back",start:"fwd",startcard:"fwd",openfall:"fwd",closefall:"back",endsession:"back",puzzle:"fwd",closepuzzle:"back",tour:"fwd",tourclose:"back",tourthema:"fwd",pnext:"fwd",rate:"fwd",peek:"fade",peekback:"fade",peekopen:"fade",revealfall:"fade"};
const RM=matchMedia("(prefers-reduced-motion: reduce)");
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return;
  const k=NAV[b.dataset.act];
  if(k&&document.startViewTransition&&!RM.matches){document.documentElement.dataset.vt=k;document.startViewTransition(()=>act(e,b));}
  else act(e,b);
});
function act(e,b){
  const a=b.dataset.act, d=b.dataset;
  if(a==="rdmode"&&lpFired){lpFired=false;return}
  if(a==="rdmode"){rdMode=(rdMode+1)%3;try{localStorage.setItem("rd",rdMode)}catch(_){}render();toast(["Lesemodus aus","Lesemodus: Gelesenes mit Schatten","Lesemodus: Gelesenes als Textmarker"][rdMode]);return}
  if(a==="endsession"||a==="tab")rdPopClose();
  if(a==="more"){view={tab:"home"};startSession("due");return}
  if(a==="full"){view={tab:"home"};render();window.scrollTo(0,0);return}
  if(a==="tab"){view={tab:d.tab};S=null;render();window.scrollTo(0,0);return}
  if(a==="openfach"){view={tab:"faecher",fach:d.fid};render();window.scrollTo(0,0);return}
  if(a==="openthema"){view={...view,thema:d.tid};render();window.scrollTo(0,0);return}
  if(a==="up"){if(view.thema)view={tab:"faecher",fach:view.fach};else view={tab:"faecher"};render();window.scrollTo(0,0);return}
  if(a==="start"){startSession(d.what,d.fid,d.tid,d.aid);return}
  if(a==="startcard"){startSession("card",d.fid,d.tid,d.cid);return}
  if(a==="openfall"){view.fall={fid:d.fid,tid:d.tid,cid:d.cid,revealed:false,y:window.scrollY};render();window.scrollTo(0,0);return}
  if(a==="closefall"){const y=view.fall.y;view.fall=null;render();window.scrollTo(0,y||0);return}
  if(a==="revealfall"){const tgt=view.fall||S.ui;tgt.ans=($("#ans")||{}).value||"";tgt.revealed=true;render();return}
  if(a==="puzzle"){startPuzzle(d.fid,0);return}
  if(a==="tour"){openTour(d.fid);return}
  if(a==="tournext"){tourStep(1);return}
  if(a==="tourprev"){tourStep(-1);return}
  if(a==="tourjump"){tourGo(+d.i);return}
  if(a==="tourclose"){const fid=view.tour.fid;view={tab:"faecher",fach:fid};render();window.scrollTo(0,0);return}
  if(a==="tourthema"){const fid=view.tour.fid;view={tab:"faecher",fach:fid,thema:d.tid};render();window.scrollTo(0,0);return}
  if(a==="closepuzzle"){view.puzzle=null;render();return}
  if(a==="pnext"){startPuzzle(view.puzzle.fid,view.puzzle.ai+1);return}
  if(a==="pblock"){view.puzzle.sel=d.id;view.puzzle.bad=null;render();return}
  if(a==="pslot"){const v=view.puzzle;if(!v.sel){toast("Erst einen Baustein antippen");return}
    const bl=v.blocks.find(x=>x.id===v.sel); if(bl.tid===d.tid){v.placed[bl.id]=true;v.sel=null;v.bad=null}else{v.err++;v.bad=d.tid}
    render();return}
  if(a==="endsession"){S=null;render();return}
  if(a==="export")return exportFile();
  if(a==="import")return $("#file").click();
  if(a==="fsopen")return fsConnect(false);
  if(a==="fsnew")return fsConnect(true);
  if(a==="fssync")return fsSync();
  if(a==="bclose"){closeBubble();return}
  if(a==="skipload"){SY.loaded=true;store.loadDay=today();save();render();return}
  if(a==="reload"){loadContent().then(()=>{render();toast("Inhalte neu geladen")});return}
  if(a==="reset"){if(confirm("Lernstand auf diesem Gerät wirklich löschen? Das lässt sich nicht rückgängig machen.")){store.p={};store.seen={};save();render()}return}
  if(!S)return;
  const it=cur(), u=S.ui;
  if(a==="seen"){
    markSeen(it.fid,it.tid);
    it.t.karten.forEach(k=>{const key=cKey(it.fid,it.tid,k.id);const p=store.p[key];if(p&&p.stage===1){p.stage=avail(k)[1]||4}});
    const key=cKey(it.fid,it.tid,it.cid);const p={...P(key)};p.stage=avail(it.k)[1]||4;p.due=today();p.last=new Date().toISOString();store.p[key]=p;save();
    prepItem();render();window.scrollTo(0,0);return}
  if(a==="mright"){
    const i=+d.i, ci=u.order[u.pos];
    if(i===ci){u.matched[i]=true;u.bad=null;zmove(1)}else{u.err++;u.bad=i;render();setTimeout(()=>{if(S&&S.ui===u&&u.bad===i){u.bad=null;render()}},700);return}
    render();return}
  if(a==="peek"){u.peek=true;u.peekOpen=false;render();window.scrollTo(0,0);return}
  if(a==="peekopen"){u.peekOpen=true;render();return}
  if(a==="peekback"){u.peek=false;render();window.scrollTo(0,0);return}
  if(a==="znext"){zmove(1);render();return}
  if(a==="zprev"){zmove(-1);render();return}
  if(a==="check3"||a==="reveal3"){
    const sols=[]; it.k.luecken.forEach(s=>s.split(/\{\{(.*?)\}\}/).forEach((p,j)=>{if(j%2)sols.push(p.split("|"))}));
    u.vals={}; document.querySelectorAll("[data-gap]").forEach(inp=>u.vals[inp.dataset.gap]=inp.value);
    u.res=sols.map((alts,i)=>a==="check3"&&norm(u.vals[i]||"")!==""&&alts.some(x=>norm(x)===norm(u.vals[i]||"")));
    u.checked=true;render();return}
  if(a==="reveal4"){u.ans=$("#ans").value;u.revealed=true;u.kp=[];render();return}
  if(a==="checka"){
    u.val=$("#num").value; u.skip=!!d.skip;
    u.ok=!u.skip&&parseNum(u.val).some(x=>Math.abs(x-it.a.antwort)<=(it.a.toleranz??0.01));
    u.checked=true;render();return}
  if(a==="rate"){
    const r=d.r, fk=it.kind+":"+it.fid+":"+(it.cid||it.id);
    S.first=S.first||{}; if(!S.first[fk]){S.first[fk]=1;S.nCards=(S.nCards||0)+1;if(r!=="again")S.nOk=(S.nOk||0)+1}
    const req=it.kind==="a"?rateAufgabe(it.fid,it.id,r):rateCard(it.fid,it.t,it.k,r);
    next(req);return}
}
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.kp!==undefined&&S){S.ui.kp[+e.target.dataset.kp]=e.target.checked;render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&S&&e.target.matches(".gap,#num")){e.preventDefault();const b=document.querySelector('[data-act="check3"],[data-act="checka"]:not([data-skip])');if(b)b.click()}
});

function zmove(dir){const u=S.ui,n=u.order.length;if(Object.keys(u.matched).length===n)return;
  for(let s=1;s<=n;s++){const p=((u.pos+dir*s)%n+n)%n;if(!u.matched[u.order[p]]){u.pos=p;return}}}
let tx=null;
document.addEventListener("touchstart",e=>{tx=e.target.closest("#zbar")?e.touches[0].clientX:null},{passive:true});
document.addEventListener("touchend",e=>{if(tx===null||!S)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40){zmove(dx<0?1:-1);render()}},{passive:true});
document.addEventListener("keydown",e=>{if(S&&S.ui&&S.ui.order&&!e.target.matches("input,textarea")){if(e.key==="ArrowRight"){zmove(1);render()}if(e.key==="ArrowLeft"){zmove(-1);render()}}});

/* ============ Export / Import ============ */
async function exportFile(){
  const data={app:"lernapp",format:2,device:store.device,exportiert:new Date().toISOString(),p:store.p,seen:store.seen};
  const name="lernstand.json";
  const file=new File([JSON.stringify(data)],name,{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});store.dirty=0;store.lastExport=data.exportiert;save();render();return}}catch(err){if(err.name==="AbortError")return}
  store.dirty=0;store.lastExport=data.exportiert;save();
  const url=URL.createObjectURL(file);const el=document.createElement("a");el.href=url;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  render();
}
function importFile(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{const d=JSON.parse(r.result); if(d.app!=="lernapp"||!d.p)throw 0;
      const neu=merge(d.p,d.seen); SY.loaded=true; store.loadDay=today(); save();toast(neu+" Einträge übernommen");render();
    }catch(err){toast("Das ist keine Lernstand-Datei")}
  };
  r.readAsText(f); e.target.value="";
}

/* ============ iCloud-Sync ============ */
const FS="showOpenFilePicker" in window; // Chrome/Edge am Mac
const SY={loaded:false,handle:null,perm:false,lastWrite:null,timer:null};
function merge(remote,seen){let n=0;Object.keys(seen||{}).forEach(k=>store.seen[k]=1);Object.entries(remote||{}).forEach(([k,v])=>{const l=store.p[k];if(!l||(v.last&&(!l.last||v.last>l.last))){store.p[k]=v;n++}});return n}
function markDirty(){store.dirty=(store.dirty||0)+1;save();if(SY.perm)scheduleWrite()}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("lernapp",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kv(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("kv",v===undefined?"readonly":"readwrite");const st=tx.objectStore("kv");const r=v===undefined?st.get(k):st.put(v,k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fsConnect(neu){
  try{
    let h;
    if(neu)h=await showSaveFilePicker({suggestedName:"lernstand.json",types:[{description:"Lernstand",accept:{"application/json":[".json"]}}]});
    else [h]=await showOpenFilePicker({types:[{description:"Lernstand",accept:{"application/json":[".json"]}}]});
    SY.handle=h; await kv("handle",h); SY.perm=true; await fsSync();
  }catch(e){if(e.name!=="AbortError")toast("Datei konnte nicht verbunden werden")}
}
async function fsSync(){
  try{
    if(!SY.perm){const q=await SY.handle.requestPermission({mode:"readwrite"});if(q!=="granted"){toast("Zugriff nicht erlaubt");return}SY.perm=true}
    const txt=await (await SY.handle.getFile()).text();
    let n=0; if(txt.trim()){try{const d=JSON.parse(txt);if(d.app==="lernapp")n=merge(d.p,d.seen)}catch(e){}}
    SY.loaded=true; await fsWrite(); toast(n?n+" Einträge vom anderen Gerät übernommen":"Synchronisiert"); render();
  }catch(e){toast("Synchronisieren fehlgeschlagen");SY.perm=false;render()}
}
async function fsWrite(){
  // vor dem Schreiben nochmal einlesen, damit Stände vom iPhone nicht überschrieben werden
  try{const txt=await (await SY.handle.getFile()).text();if(txt.trim()){const d=JSON.parse(txt);if(d.app==="lernapp")merge(d.p,d.seen)}}catch(e){}
  const w=await SY.handle.createWritable();
  await w.write(JSON.stringify({app:"lernapp",format:1,device:store.device||"Mac",exportiert:new Date().toISOString(),p:store.p,seen:store.seen}));
  await w.close(); store.dirty=0; store.lastExport=new Date().toISOString(); SY.lastWrite=new Date(); save();
}
function scheduleWrite(){clearTimeout(SY.timer);SY.timer=setTimeout(()=>fsWrite().catch(()=>{SY.perm=false;toast("Automatisches Speichern unterbrochen – bitte neu synchronisieren")}),800)}
function syncBanner(){
  if(FS&&SY.handle&&SY.perm)return `<div class="muted" style="font-size:12px">✓ Automatisch gespeichert in ${esc(SY.handle.name)}${SY.lastWrite?" · "+SY.lastWrite.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):""}</div>`;
  return "";
}
const CLOUD=`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9EC0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.5 1.6A3.8 3.8 0 0 1 17.5 18z"/><path d="M12 11v6M9.5 14.5 12 17l2.5-2.5"/></svg>`;
function bubbleHTML(){
  let t,x,btn;
  if(FS){ if(SY.bclosed)return "";
    if(!SY.handle){t="iCloud-Datei verbinden";x="Einmal deine lernstand.json wählen, danach speichert die App automatisch.";btn=`<button class="btn-p" data-act="fsopen">Datei wählen</button><button class="blink" data-act="fsnew">Noch keine Datei? Neu anlegen</button>`}
    else if(!SY.perm){t="Mit iCloud synchronisieren?";x="Holt den Stand vom iPhone und speichert ab dann automatisch.";btn=`<button class="btn-p" data-act="fssync">Synchronisieren</button>`}
    else return "";
  } else { if(SY.loaded||store.loadDay===today())return "";
    t="Stand aus iCloud laden?";x="Damit du da weitermachst, wo du am Mac aufgehört hast.";btn=`<button class="btn-p" data-act="import">Laden</button>`}
  return `<div class="bubble" id="bubble" role="dialog" aria-label="${t}"><button class="bx" data-act="bclose" aria-label="Schließen">✕</button><div class="brow">${CLOUD}<div><div class="bt">${t}</div><div class="bs">${x}</div></div></div>${btn}<i class="btail"></i></div>`;
}
function placeBubble(){const b=$("#bubble"),tab=document.querySelector('#nav [data-tab="daten"]');if(!b||!tab)return;const r=tab.getBoundingClientRect(),n=$("#nav").getBoundingClientRect();
  b.style.bottom=(innerHeight-n.top+14)+"px";const bl=b.getBoundingClientRect().left;b.querySelector(".btail").style.left=(r.left+r.width/2-bl-9)+"px"}
addEventListener("resize",placeBubble);
document.addEventListener("click",e=>{const b=$("#bubble");if(b&&!e.target.closest("#bubble"))closeBubble()},true);
function closeBubble(){if(FS)SY.bclosed=true;else{SY.loaded=true;store.loadDay=today();save()}const b=$("#bubble");if(b)b.remove()}
(async()=>{if(FS){try{const h=await kv("handle");if(h){SY.handle=h;SY.perm=(await h.queryPermission({mode:"readwrite"}))==="granted";if(SY.perm)await fsSync()}}catch(e){}}})();



/* ============ Start ============ */
$("#file").addEventListener("change",importFile);
loadContent().then(render).catch(()=>{app.innerHTML=`<div class="card"><b>Inhalte konnten nicht geladen werden.</b><p class="txt muted">Die App muss über GitHub Pages (oder einen Webserver) geöffnet werden, nicht als Datei. Offline funktioniert sie, sobald sie einmal online geladen wurde.</p></div>`});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
